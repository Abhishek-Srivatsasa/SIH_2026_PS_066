name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'PS_066/site/**'
      - 'site/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine site path
        id: site-path
        run: |
          if [ -d "PS_066/site" ]; then
            echo "path=PS_066/site" >> $GITHUB_OUTPUT
          elif [ -d "site" ]; then
            echo "path=site" >> $GITHUB_OUTPUT
          else
            echo "Error: site directory not found" && exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.site-path.outputs.path }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
